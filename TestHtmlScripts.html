<!DOCTYPE html>
<html lang="ua-UA, 🇯🇵-JP">
<head>
	<link rel="icon" type="image/png" href="https://i.imgur.com/VgR5wIG.png">
	<title>Пример!</title>

	<base target="_blank">
	<META http-equiv="Content-Type" content="text/html; charset=utf-8">
	<link href="https://fonts.googleapis.com/css?family=Open+Sans:400,600,600i" rel="stylesheet">

	<style type="text/css">
		* {font-family: "Open Sans";}
		a {text-decoration: none;}
		html {cursor: crosshair;scrollbar-color: var(--fon-sb-1) var(--fon-sb-2);}
		:root {
			--fon-bg: rgb(255,40,148, 1);
			--fon-sb-1: rgb(252,157,195, 1);
			--fon-sb-2: rgba(255,40,148, 0.95);
			--fon-bs: rgba(255,0,128, 0.20);

		}
		body {
			height: 1660px;
			margin: 4.70em 0em 0em 0.70em;
			background: #242424;
			color: #fff;
			cursor: crosshair;
		}
		.Content {
			max-width: 1080px;
			margin-left: auto;
			margin-right: auto;
		}
		h1 {
			position: fixed;
			color: #fff;
			background: -webkit-linear-gradient(top, var(--fon-bg) 100%, rgba(255,255,255,0));
			padding: 10px 10px 10px 1em;
			opacity: 0.95;
			width: 100%;
  			height: 40px;
			left: 0;
  			top: 0;
			margin: 0;
			border-radius: 0px;
			z-index: 1;
		}
		.divm {
			background: rgba(60, 60, 60, 0.65);
			color: #fff;
			border-left: 6px solid var(--fon-bg);
			border-radius: 5px;
			font-size: 14px;
			padding: 5px;
			font-family: "Verdana";
			white-space: nowrap;
			box-shadow: 0px 0px 100px var(--fon-bs);
		}
		#TeamSESH {
			text-shadow: -1.70px 0px 25px rgba(209, 209, 209, 0.7), -1.70px 0px 25px rgb(209, 209, 209, 0.7);
			color: rgb(255, 255, 255);
			user-select: none;
			position: fixed;
			font-size: 16px;
			right: 4px;
			bottom: 2px;
			cursor: crosshair;
			transition: 0.3s;
		}
		#TeamSESH:hover { color: rgb(196, 196, 196); }
	</style>
	<style type="text/css">
		@media (max-width: 1100px), (max-width: 1101px) {
			body {height: 1070px;}
			.Content {
				max-width: 900px;
				margin-left: auto;
				margin-right: auto;
			}
		}
	</style>
</head>
<body>
<div>
	<center>
		<h1>
			<b>Пример движка от "NVE", для фоток.</b>
			<a id="TeamSESH" title="''TeamSESH - Лучше чем (gta5-mods)''" href="https://www.youtube.com/@TeamSESHBones/videos"><b>TeamSESH</b></a>
		</h1>
	</center>
</div>

<!--[Как работает фотки и движок для фоток...]-->
<div class="Content divm">

	<!--[Блок "<div>", где крутится фотки... Фотки взяты из "NVE", мода...]-->
	<div id="flickrembed"></div><div style="position:absolute;top:-70px;display:block;text-align:center;z-index:1;"></div>

	<!--[Тут скрипт через который всё работает... Тойсть сам движок для фоток.]-->
	<script>
		function addScript(src, callback) {
			var s = document.createElement('script');
			s.setAttribute('src', src);
			s.onload = callback;
			document.body.appendChild(s);
		}

		function callback3() {
			window.setTimeout(function () {
				$('#flickrembed').html(`<div id="gallery" style="display:none;margin:0auto;!important" class="center">`+
					// Где (...), надо вставить Ссылку или Путь. Для пути надо вписать (file:///), только потом путь к фото из "ПК". Где (Текст), можем вписать что-то... Сам скрипт: (`<img alt="Текст" src="..." data-image="..." data-description="Текст">`+)

					`<img alt="Stormbringer | Grand Theft Auto V" src="https://live.staticflickr.com/65535/53644219885_e871da95a7_h.jpg" data-image="https://live.staticflickr.com/65535/53644219885_e871da95a7_h.jpg" data-description="Stormbringer | Grand Theft Auto V">`+
					`<img alt="Zancudo Hangar | Grand Theft Auto V" src="https://live.staticflickr.com/65535/52857482776_c080a46526_h.jpg" data-image="https://live.staticflickr.com/65535/52857482776_c080a46526_h.jpg" data-description="Zancudo Hangar | Grand Theft Auto V">`+
					`<img alt="Los Santos | Grand Theft Auto V" src="https://live.staticflickr.com/65535/52292044317_7e4691442a_h.jpg" data-image="https://live.staticflickr.com/65535/52292044317_7e4691442a_h.jpg" data-description="Los Santos | Grand Theft Auto V">`+
					`<img alt="Sunrise | GTA V" src="https://live.staticflickr.com/65535/49894271032_14894e45fa_h.jpg" data-image="https://live.staticflickr.com/65535/49894271032_14894e45fa_h.jpg" data-description="Sunrise | GTA V">`+
					`<img alt="Golden Hour | GTA V" src="https://live.staticflickr.com/65535/49829021193_f05f71d654_h.jpg" data-image="https://live.staticflickr.com/65535/49829021193_f05f71d654_h.jpg" data-description="Golden Hour | GTA V">`+
					`<img alt="Dry Storm | GTA V" src="https://live.staticflickr.com/65535/49797835222_6b171b1478_h.jpg" data-image="https://live.staticflickr.com/65535/49797835222_6b171b1478_h.jpg" data-description="Dry Storm | GTA V">`+
					`<img alt="Warm Light | GTA V" src="https://live.staticflickr.com/65535/49784507671_89ef7bf039_h.jpg" data-image="https://live.staticflickr.com/65535/49784507671_89ef7bf039_h.jpg" data-description="Warm Light | GTA V">`+
					`<img alt="Construction Time | GTA V" src="https://live.staticflickr.com/65535/49749287751_a8572ef6a5_h.jpg" data-image="https://live.staticflickr.com/65535/49749287751_a8572ef6a5_h.jpg" data-description="Construction Time | GTA V">`+
				`</div>`);

				api = $("#gallery").unitegallery({
					gallery_images_preload_type: "minimal",
					gallery_autoplay: false,
					slider_control_zoom: true,
					gallery_play_interval: 3000,
					slider_scale_mode: "fill",
					slider_scale_mode_fullscreen: "fill",
					slider_enable_bullets: false,
					gallery_skin: "alexis",
					slider_bullets_skin: "alexis",
					gallery_theme: "carousel"
				});
				api.resize(1200, 1200);

				$('#gallery').css({ 'width':'1000 !important' });
				$('#gallery').css({ 'min-width':'1000 !important' });
				$('#gallery').css({ 'max-width':'1000 !important' });
				$('#gallery').css({ 'height':'1000 !important' });
				$('#gallery').css({ 'min-height':'1000 !important' });
				$('#gallery').css({ 'max-height':'1000 !important' });
			}, 1000);
		}

		function callback2() {
			$('head').append('<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/PsIxGG/My-Scripts@refs/heads/main/HTML/EngineForPhotos/unite-gallery.css" type="text/css"/>');
			$('head').append('<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/PsIxGG/My-Scripts@refs/heads/main/HTML/EngineForPhotos/alexis.css" type="text/css"/>');
			$('head').append('<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/PsIxGG/My-Scripts@refs/heads/main/HTML/EngineForPhotos/ug-theme-default.css" type="text/css"/>');
			addScript('https://cdn.jsdelivr.net/gh/PsIxGG/My-Scripts@refs/heads/main/HTML/EngineForPhotos/ug-theme-carousel.js', callback3);
		}

		function callback1() {
			$.getScript("https://cdn.jsdelivr.net/gh/PsIxGG/My-Scripts@refs/heads/main/HTML/EngineForPhotos/remodal.min.js");
			addScript('https://cdn.jsdelivr.net/gh/PsIxGG/My-Scripts@refs/heads/main/HTML/EngineForPhotos/unitegallery.min.js', callback2);
		}
		addScript('https://code.jquery.com/jquery-1.12.1.min.js', callback1);
	</script>

	<!--[Тут доп "CSS", скрипт который миняет фон фоток. Важно! Если указать "CSS", скрипты от фоток выше самих фоток то они рабртать не будут!]-->
	<style type="text/css">
		.ug-slider-wrapper .ug-item-wrapper {position: absolute;overflow: hidden;}
		.ug-lightbox .ug-lightbox-overlay {
			z-index: 1;
			width: 100%;
			height: 100%;
			background-color: var(--fon-bg);
			opacity: 1;
		}
		.ug-lightbox .ug-lightbox-top-panel-overlay {
			width: 100%;
			height: 100%;
			position: absolute;
			background-color: var(--fon-bg);
			opacity: 0.35;
		}
	</style>

	|    2.И надемся на то что нече-го не сломается!																					|

</div>
<!--[Конец скрипта... Для фоток!]-->

</body>
</html>
